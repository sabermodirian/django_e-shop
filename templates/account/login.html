{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}
ورود
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">ورود به حساب کاربری</h1>

        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}

            {{ form|crispy }}

            <button type="submit" class="btn btn-primary">
                ورود
            </button>
        </form>

        <p class="mt-3">
            حساب کاربری ندارید؟
            <a href="{% url 'account_signup' %}">
                ثبت‌ نام کنید
            </a>
        </p>
    </div>
</div>
{% endblock %}
