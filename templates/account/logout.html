{% extends "_base.html" %}

{% block page_title %}
    خروج از حساب
{% endblock %}

{% block content %}
    <h1>خروج از حساب کاربری</h1>
    <p>آیا مطمئن هستید؟</p>

    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">بله، خروج</button>
        <a href="/" class="btn btn-secondary">انصراف</a>
    </form>
{% endblock %}
