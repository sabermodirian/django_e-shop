{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}
ثبت ‌نام
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">ایجاد حساب کاربری</h1>

        <form method="post" action="{% url 'account_signup' %}">
            {% csrf_token %}

            {{ form|crispy }}

            <button type="submit" class="btn btn-success">
                ثبت ‌نام
            </button>
        </form>

        <p class="mt-3">
            قبلاً حساب ساخته‌اید؟
            <a href="{% url 'account_login' %}">
                وارد شوید
            </a>
        </p>
    </div>
</div>
{% endblock %}
