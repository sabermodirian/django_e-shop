{% extends '_base.html' %}
{% load crispy_forms_tags %}
{% block page_title %}
	WelCome To HOMEPAGE
{% endblock %}
{% block content %}
	{% if user.is_authenticated %}
        <h1>WelCome To HOMEPAGE</h1>
    <h2>با موفقیت وارد شدید</h2>
    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit">خروج</button>
    </form>
{% else %}
    <a href="{% url 'account_login' %}">ورود</a>
{% endif %}

{% endblock %}
